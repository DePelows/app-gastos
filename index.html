<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Transporte & Calendario</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #151d2f;
      --card-alt: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #283548;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 40px; }

    /* Tarjetas */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
    .card-title { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    /* Métricas */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-box { background: var(--card-alt); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
    .stat-box .title { font-size: 0.7rem; color: var(--muted); }
    .stat-box .number { font-size: 1.15rem; font-weight: 800; margin-top: 2px; }

    /* Alerta de saldo */
    .alert-banner { padding: 12px; border-radius: 10px; font-weight: 700; font-size: 0.9rem; text-align: center; border: 1px solid transparent; }
    .alert-danger { background: rgba(239,68,68,0.15); border-color: var(--danger); color: #fca5a5; }
    .alert-success { background: rgba(34,197,94,0.15); border-color: var(--success); color: #86efac; }

    /* Configuración rápida */
    .quick-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .field label { font-size: 0.7rem; color: var(--muted); display: block; margin-bottom: 4px; }
    .field input { width: 100%; background: var(--card-alt); border: 1px solid var(--border); border-radius: 8px; color: #fff; padding: 6px 8px; font-size: 0.85rem; text-align: right; }

    /* Calendario */
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cal-header h3 { font-size: 0.95rem; font-weight: 700; color: var(--accent); }
    .cal-nav { background: var(--card-alt); border: 1px solid var(--border); color: #fff; border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.7rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    
    .day-cell { min-height: 52px; background: var(--card-alt); border: 1px solid var(--border); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
    .day-cell.other-month { opacity: 0.25; }
    .day-cell.today { border-color: var(--accent); }
    .day-cell.is-corte { background: rgba(56,189,248,0.12); border-color: var(--accent); }
    .day-cell.custom-cost { border-color: var(--warning); }
    .day-cell .num { font-size: 0.75rem; font-weight: 700; }
    .day-cell .cost { font-size: 0.65rem; text-align: right; font-weight: 600; }
    .day-cell.zero-cost .cost { color: var(--muted); }
    .day-cell.standard-cost .cost { color: var(--accent); }
    .day-cell.edited-cost .cost { color: var(--warning); }

    /* Modal de Edición */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 340px; padding: 16px; }
    .modal h4 { font-size: 1rem; color: var(--accent); margin-bottom: 12px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
    .btn { flex: 1; padding: 9px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #090d16; }
    .btn-secondary { background: var(--card-alt); color: #fff; border: 1px solid var(--border); }
  </style>
</head>
<body>

<div class="app">
  <div class="card">
    <div class="card-title">Parámetros Habituales</div>
    <div class="quick-inputs">
      <div class="field">
        <label>Ida base</label>
        <input type="number" id="baseIda" step="0.10" value="3.00" onchange="actualizarBase()" />
      </div>
      <div class="field">
        <label>Vuelta base</label>
        <input type="number" id="baseVuelta" step="0.10" value="3.50" onchange="actualizarBase()" />
      </div>
      <div class="field">
        <label>Saldo en mano</label>
        <input type="number" id="saldoActual" step="0.50" value="40.00" onchange="calcularTodo()" />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span id="labelCiclo">Ciclo actual: ...</span>
      <span style="color: var(--accent);">Corte día 20</span>
    </div>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="title">Viajes restantes</div>
        <div class="number" id="diasRestantes">0</div>
      </div>
      <div class="stat-box">
        <div class="title">Total a gastar al 20</div>
        <div class="number" id="totalCiclo">S/ 0.00</div>
      </div>
    </div>
  </div>

  <div id="bannerEstado" class="alert-banner alert-danger">Calculando...</div>

  <!-- Vista Calendario -->
  <div class="card">
    <div class="cal-header">
      <button class="cal-nav" onclick="cambiarMes(-1)">◀</button>
      <h3 id="calTitulo">Septiembre 2026</h3>
      <button class="cal-nav" onclick="cambiarMes(1)">▶</button>
    </div>
    <div class="weekdays">
      <div>D</div><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div>
    </div>
    <div class="calendar-grid" id="gridDias"></div>
  </div>
</div>

<!-- Modal para editar día puntual -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h4 id="modalFechaTitulo">Editar día</h4>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="field">
        <label>Gasto específico para este día (S/)</label>
        <input type="number" id="inputGastoDia" step="0.10" style="text-align: left; padding: 8px;" />
      </div>
      <div style="display: flex; gap: 6px;">
        <button class="btn btn-secondary" style="font-size: 0.75rem;" onclick="setearRapido(0)">No viajo (S/ 0)</button>
        <button class="btn btn-secondary" style="font-size: 0.75rem;" onclick="setearRapido(tarifaBaseDiaria())">Tarifa Base</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarDia()">Guardar</button>
    </div>
  </div>
</div>

<script>
  let mesVisual = new Date().getMonth();
  let anioVisual = new Date().getFullYear();
  let diaSeleccionadoKey = null;

  // Estructura en localStorage: { 'YYYY-MM-DD': monto }
  let gastosCustom = JSON.parse(localStorage.getItem('gastos_custom') || '{}');
  let config = JSON.parse(localStorage.getItem('config_transporte') || '{"ida": 3.0, "vuelta": 3.5, "saldo": 40.0}');

  function tarifaBaseDiaria() {
    return (parseFloat(config.ida) || 0) + (parseFloat(config.vuelta) || 0);
  }

  function formatoKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dia = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dia}`;
  }

  function getGastoDelDia(d) {
    const key = formatoKey(d);
    if (gastosCustom.hasOwnProperty(key)) {
      return gastosCustom[key];
    }
    // Por defecto: sábados y domingos gasto 0, lunes a viernes tarifa base
    const dayOfWeek = d.getDay();
    return (dayOfWeek === 0 || dayOfWeek === 6) ? 0 : tarifaBaseDiaria();
  }

  function esCustom(d) {
    return gastosCustom.hasOwnProperty(formatoKey(d));
  }

  function actualizarBase() {
    config.ida = parseFloat(document.getElementById('baseIda').value) || 0;
    config.vuelta = parseFloat(document.getElementById('baseVuelta').value) || 0;
    localStorage.setItem('config_transporte', JSON.stringify(config));
    calcularTodo();
  }

  function cambiarMes(offset) {
    mesVisual += offset;
    if (mesVisual < 0) { mesVisual = 11; anioVisual--; }
    else if (mesVisual > 11) { mesVisual = 0; anioVisual++; }
    renderCalendario();
  }

  function renderCalendario() {
    const nombresMes = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    document.getElementById('calTitulo').textContent = `${nombresMes[mesVisual]} ${anioVisual}`;

    const grid = document.getElementById('gridDias');
    grid.innerHTML = '';

    const primerDiaMes = new Date(anioVisual, mesVisual, 1).getDay();
    const totalDiasMes = new Date(anioVisual, mesVisual + 1, 0).getDate();
    const totalDiasAnt = new Date(anioVisual, mesVisual, 0).getDate();

    const hoy = new Date();
    const hoyKey = formatoKey(hoy);

    // Relleno días mes anterior
    for (let i = primerDiaMes - 1; i >= 0; i--) {
      const d = new Date(anioVisual, mesVisual - 1, totalDiasAnt - i);
      grid.appendChild(crearCelda(d, true));
    }

    // Días del mes actual
    for (let dia = 1; dia <= totalDiasMes; dia++) {
      const d = new Date(anioVisual, mesVisual, dia);
      grid.appendChild(crearCelda(d, false, formatoKey(d) === hoyKey));
    }

    // Relleno mes siguiente para completar grilla
    const totalCeldas = grid.children.length;
    const celdasRestantes = (7 - (totalCeldas % 7)) % 7;
    for (let i = 1; i <= celdasRestantes; i++) {
      const d = new Date(anioVisual, mesVisual + 1, i);
      grid.appendChild(crearCelda(d, true));
    }
  }

  function crearCelda(fecha, esOtroMes, esHoy = false) {
    const el = document.createElement('div');
    const gasto = getGastoDelDia(fecha);
    const custom = esCustom(fecha);

    let claseTipo = 'standard-cost';
    if (gasto === 0) claseTipo = 'zero-cost';
    if (custom) claseTipo = 'edited-cost';

    el.className = `day-cell ${esOtroMes ? 'other-month' : ''} ${esHoy ? 'today' : ''} ${custom ? 'custom-cost' : ''} ${claseTipo} ${fecha.getDate() === 20 ? 'is-corte' : ''}`;
    el.innerHTML = `
      <span class="num">${fecha.getDate()}</span>
      <span class="cost">${gasto > 0 ? 'S/' + gasto.toFixed(1) : '-'}</span>
    `;

    el.onclick = () => abrirModal(fecha);
    return el;
  }

  function abrirModal(fecha) {
    diaSeleccionadoKey = formatoKey(fecha);
    document.getElementById('modalFechaTitulo').textContent = `Día ${diaSeleccionadoKey}`;
    document.getElementById('inputGastoDia').value = getGastoDelDia(fecha).toFixed(2);
    document.getElementById('modalOverlay').style.display = 'flex';
  }

  function cerrarModal() {
    document.getElementById('modalOverlay').style.display = 'none';
  }

  function setearRapido(valor) {
    document.getElementById('inputGastoDia').value = Number(valor).toFixed(2);
  }

  function guardarDia() {
    const val = parseFloat(document.getElementById('inputGastoDia').value) || 0;
    gastosCustom[diaSeleccionadoKey] = val;
    localStorage.setItem('gastos_custom', JSON.stringify(gastosCustom));
    cerrarModal();
    calcularTodo();
  }

  function calcularTodo() {
    renderCalendario();

    config.saldo = parseFloat(document.getElementById('saldoActual').value) || 0;
    localStorage.setItem('config_transporte', JSON.stringify(config));

    // Determinar ciclo según el día 20
    const hoy = new Date();
    const diaActual = hoy.getDate();
    let fechaInicio, fechaFin;

    if (diaActual <= 20) {
      // Ciclo que finaliza el 20 del mes en curso
      fechaFin = new Date(hoy.getFullYear(), hoy.getMonth(), 20);
      fechaInicio = hoy; // Para proyectar lo que falta gastar
    } else {
      // Ciclo que finaliza el 20 del siguiente mes
      fechaFin = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 20);
      fechaInicio = hoy;
    }

    const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Set","Oct","Nov","Dic"];
    document.getElementById('labelCiclo').textContent = `Corte: 20 de ${meses[fechaFin.getMonth()]}`;

    let totalGastoProyectado = 0;
    let diasConViaje = 0;

    let cursor = new Date(fechaInicio.getTime());
    while (cursor <= fechaFin) {
      const gasto = getGastoDelDia(cursor);
      totalGastoProyectado += gasto;
      if (gasto > 0) diasConViaje++;
      cursor.setDate(cursor.getDate() + 1);
    }

    document.getElementById('diasRestantes').textContent = diasConViaje;
    document.getElementById('totalCiclo').textContent = `S/ ${totalGastoProyectado.toFixed(2)}`;

    const balance = config.saldo - totalGastoProyectado;
    const banner = document.getElementById('bannerEstado');

    if (balance < 0) {
      banner.className = 'alert-banner alert-danger';
      banner.textContent = `Te faltan S/ ${Math.abs(balance).toFixed(2)} para llegar al 20`;
    } else {
      banner.className = 'alert-banner alert-success';
      banner.textContent = `Presupuesto cubierto. Te sobrarán S/ ${balance.toFixed(2)}`;
    }
  }

  window.onload = () => {
    document.getElementById('baseIda').value = config.ida || 3.0;
    document.getElementById('baseVuelta').value = config.vuelta || 3.5;
    document.getElementById('saldoActual').value = config.saldo || 0;
    calcularTodo();
  };
</script>
</body>
</html>
